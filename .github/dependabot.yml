# Dependabot version updates. Security alerts for the Cargo graph come from
# Cargo.lock; this file adds the update PRs. `cargo deny check` in CI (deny.toml)
# still gates every PR: pure-Rust graph, licences, advisories.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # rtnetlink is built on a specific netlink-packet-route; bumping one alone leaves two
      # incompatible copies of the message types in the graph (this broke main once).
      # They move together, majors included. Listed first: a crate joins the first group it matches.
      netlink:
        patterns: ["rtnetlink", "netlink-*"]
      # One PR for compatible bumps; majors stay separate so they get reviewed alone.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    ignore:
      # The base image is the OpenWrt build host, exercised only by the release workflow.
      # Move it by hand (and prove it on an -rc tag), not through an unreviewed PR.
      - dependency-name: ubuntu
    commit-message:
      prefix: "build"
