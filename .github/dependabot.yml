# Dependabot version updates. Security alerts for the Cargo graph come from
# Cargo.lock; this file adds the update PRs. `cargo deny check` in CI (deny.toml)
# still gates every PR: pure-Rust graph, licences, advisories.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for compatible bumps; majors stay separate so they get reviewed alone.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
