name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  compliance:
    name: version compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-version.sh

  check:
    name: fmt / clippy / test (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (failures become annotations)
        run: scripts/ci-test.sh --workspace --locked

  deny:
    name: dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ui:
    name: web UI modules parse (CSP-clean, no inline code)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax check every module as an ES module
        run: |
          set -e
          for f in $(find crates/owr-api/ui/js -name '*.js'); do
            cp "$f" /tmp/mod.mjs && node --check /tmp/mod.mjs || { echo "syntax error: $f"; exit 1; }
          done
      - name: reject inline scripts, styles and handlers
        run: |
          hits=$(grep -rnE 'on[a-z]+=|style="|innerHTML|eval\(|new Function' crates/owr-api/ui/index.html crates/owr-api/ui/js \
                 | grep -vE 'content=|^[^:]+:[0-9]+:\s*(//|\*)' || true)
          if [ -n "$hits" ]; then echo "inline code found:"; echo "$hits"; exit 1; fi
          echo "no inline code"

  cross:
    name: router binaries (aarch64 musl, static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked --target aarch64-unknown-linux-musl -- -D warnings
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl --workspace
      - name: verify static, no dynamic deps, non-executable stack
        run: |
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          for b in owr-init owr-api owr-apply owr; do
            f=target/aarch64-unknown-linux-musl/release/$b
            echo "== $f"; file "$f"
            if aarch64-linux-gnu-readelf -d "$f" | grep -q NEEDED; then echo "dynamic deps found"; exit 1; fi
            if aarch64-linux-gnu-readelf -lW "$f" | grep GNU_STACK | grep -q RWE; then echo "executable stack"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: owr-aarch64
          path: |
            target/aarch64-unknown-linux-musl/release/owr-init
            target/aarch64-unknown-linux-musl/release/owr-api
            target/aarch64-unknown-linux-musl/release/owr-apply
            target/aarch64-unknown-linux-musl/release/owr
          if-no-files-found: error

  config:
    name: OpenWrt config of every board survives make defconfig
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cache the OpenWrt checkout
        uses: actions/cache@v4
        with:
          path: ~/openwrt
          key: openwrt-tree-${{ hashFiles('build/build-image.sh') }}
          restore-keys: openwrt-tree-
      - name: OpenWrt build prerequisites (what make defconfig needs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bzip2 file gawk gettext libncurses-dev libssl-dev python3 \
            python3-setuptools rsync unzip wget zlib1g-dev
      - name: expand each board's config and verify every setting took effect
        # Every boards/*.toml is checked, so a new board is covered without editing CI.
        # All boards run; the step fails at the end if any did.
        run: |
          failed=""
          for f in boards/*.toml; do
            b=$(basename "$f" .toml)
            echo "::group::$b"
            if build/build-image.sh --board "$b" --openwrt-dir "$HOME/openwrt" --config-only --jobs 2; then
              cp build/out/resolved.diffconfig "build/out/resolved-$b.diffconfig" 2>/dev/null || true
            else
              failed="$failed $b"
            fi
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::config check failed for:$failed"; exit 1; }
      - name: resolved configs (diagnostic)
        if: always()
        run: |
          for f in build/out/resolved-*.diffconfig; do
            [ -f "$f" ] || continue
            { echo "### $(basename "$f")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

  linux-tests:
    name: Linux-only test paths (x86_64 musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (failures become annotations)
        run: scripts/ci-test.sh --workspace --locked --target x86_64-unknown-linux-musl

  nft:
    name: firewall rulesets load in a real kernel (nft -c)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - run: cargo build --locked -p owr-apply
      - name: render every fixture and check it with nft -c (network namespace)
        # sudo clears the environment; the script needs GITHUB_ACTIONS to emit annotations.
        run: sudo GITHUB_ACTIONS=true scripts/check-nft.sh target/debug/owr-apply
