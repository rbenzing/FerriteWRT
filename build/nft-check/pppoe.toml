# Firewall fixture for scripts/check-nft.sh: PPPoE WAN. The WAN zone covers pppd's
# pppoe-wan as well as the port; a port forward and a WAN input rule use it.
schema = 1

[system]
hostname = "nft-check"

[network.lan]
ports = ["lan1", "lan2", "lan3", "lan4", "lan5"]
ipv4 = "192.168.8.1/24"

[network.wan]
port = "wan"
mtu = 1492

[network.wan.proto]
type = "pppoe"
username = "user@isp.example"
password = "not-a-real-password"
service = "fibre"

[firewall]
default_wan_input = "drop"
hw_offload = true

[[firewall.port_forwards]]
name = "web"
proto = "tcp"
wan_port = "443"
dest_ip = "192.168.8.10"
dest_port = 443

[[firewall.rules]]
name = "ssh-from-office"
direction = "wan_in"
proto = "tcp"
src = "203.0.113.0/24"
dest_port = "22"
action = "accept"
