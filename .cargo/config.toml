# Cross-compilation for the router (aarch64, static musl, no C toolchain needed). The binaries
# that ship (CI "router binaries" job, build/build-image.sh) are static-PIE: rustc links this
# target as a fixed-address executable, so those builds use build/pie/rust-lld as the linker
# (CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER; see docs/STATUS.md, "Binary hardening").
# A plain `cargo xbuild` here is still fixed-address, which is fine for development.
# Only pure-Rust dependencies are allowed in the dependency graph of target binaries.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "relocation-model=pie",
  "-C", "link-arg=-zrelro",
  "-C", "link-arg=-znow",
  "-C", "link-arg=-znoexecstack",
]

[alias]
xbuild = "build --release --target aarch64-unknown-linux-musl --workspace"

# Linux-side test builds from a Windows host (run the binaries in WSL): same self-contained link.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
