[graph]
targets = [
  { triple = "aarch64-unknown-linux-musl" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-gnu" },
]

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Workspace crates are GPL-2.0-only and never published; third-party deps must be permissive.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "OpenSSL", "BSL-1.0"]

[bans]
multiple-versions = "warn"
allow-wildcard-paths = true
wildcards = "deny"
# C/asm-backed crates are banned: there is no C toolchain in the target build and
# memory-safety is a project requirement. Add an exception only with a documented reason.
deny = [
  { crate = "openssl-sys" },
  { crate = "openssl" },
  { crate = "ring" },
  { crate = "aws-lc-sys" },
  { crate = "aws-lc-rs" },
  { crate = "libsqlite3-sys" },
  { crate = "cc", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
